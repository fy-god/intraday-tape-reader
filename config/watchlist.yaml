# 自选股列表（重点盯盘，更高频轮询）
# 6 位代码，每行一个，# 开头为注释。
# 可写 '600000' / "600000" / "sh600000" 均可被解析。
# ⚠ 代码请加引号：YAML 1.1 会把裸写的 000001 当成八进制整数 1（程序已做兼容，但加引号最稳）。
watchlist:
  - "600000"    # 浦发银行
  - "000001"    # 平安银行
  - "300750"    # 宁德时代
  - "688111"    # 金山办公
  - "601318"    # 中国平安
  - "600519"    # 贵州茅台
  - "000858"    # 五粮液
  - "002594"    # 比亚迪
  - "601899"    # 紫金矿业
  - "600030"    # 中信证券

# 重点关注（severity 提升一档）
focus: []

# 忽略名单（不告警）
ignore: []
